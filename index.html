<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ระบบบันทึกเวรประจำวัน</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #f4f6f8;
      color: #333;
    }

    .container {
      max-width: 480px;
      margin: auto;
      padding: 18px;
    }

    .header {
      text-align: center;
      margin-bottom: 15px;
    }

    .header h1 {
      margin-bottom: 5px;
      color: #06c755;
      font-size: 26px;
    }

    .header p {
      margin-top: 0;
      color: #777;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.07);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .profile img {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
    }

    .profile-name {
      font-size: 20px;
      font-weight: bold;
    }

    .small {
      color: #888;
      margin-top: 4px;
      font-size: 13px;
    }

    .datetime {
      margin-top: 15px;
      padding: 10px;
      text-align: center;
      border-radius: 10px;
      background: #f4f6f8;
    }

    label.title {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select,
    textarea {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .status-item {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .status-item input {
      width: 19px;
      height: 19px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #06c755;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:disabled {
      background: #aaa;
    }

    #loading {
      text-align: center;
      padding: 40px 10px;
    }

    #main {
      display: none;
    }

    #message {
      display: none;
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
    }

    .success {
      background: #e7f8ed;
      color: #087d35;
    }

    .error {
      background: #ffe8e8;
      color: #b00000;
    }
    .image-item {
  margin-top: 10px;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 12px;
  background: #fafafa;
}

.image-item input {
  width: 100%;
}

.image-preview {
  display: none;
  width: 100%;
  max-height: 220px;
  object-fit: contain;
  margin-top: 10px;
  border-radius: 10px;
}

.remove-image {
  display: none;
  margin-top: 8px;
  width: 100%;
  padding: 8px;
  background: #ef4444;
  font-size: 14px;
}
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>👩‍🏫 บันทึกเวรประจำวัน</h1>
    <p>ระบบบันทึกเวลาการปฏิบัติหน้าที่</p>
  </div>

  <div id="loading">
    กำลังเชื่อมต่อ LINE...
  </div>

  <div id="main">

    <div class="card">

      <div class="profile">

        <img id="picture">

        <div>
          <div
            class="profile-name"
            id="displayName">
          </div>

          <div class="small">
            ผู้ปฏิบัติหน้าที่เวร
          </div>
        </div>

      </div>

      <div
        class="datetime"
        id="currentDateTime">
      </div>

    </div>


    <div class="card">

      <label class="title">
        📍 จุดปฏิบัติหน้าที่
      </label>

      <select id="dutyPoint">

        <option value="">
          -- เลือกจุดปฏิบัติหน้าที่ --
        </option>

        <option value="ประตูหน้าโรงเรียน">
          ประตูหน้าโรงเรียน
        </option>

        <option value="ประตูหลังโรงเรียน">
          ประตูหลังโรงเรียน
        </option>

        <option value="โรงอาหาร">
          โรงอาหาร
        </option>

        <option value="หน้าเสาธง">
          หน้าเสาธง
        </option>

        <option value="อาคารเรียน">
          อาคารเรียน
        </option>
     
        <option value="ประตูหลัง 3">
          ประตูหลัง 3
        </option>

        <option value="ห้องน้ำชาย">
          ห้องน้ำชาย
        </option>

        <option value="อื่น ๆ">
          อื่น ๆ
        </option>

      </select>


      <label class="title">
        ✅ สถานะ
      </label>

      <label class="status-item">
        <input
          type="radio"
          name="status"
          value="ปฏิบัติหน้าที่">
        ปฏิบัติหน้าที่
      </label>

      <label class="status-item">
        <input
          type="radio"
          name="status"
          value="มาสาย">
        มาสาย
      </label>

      <label class="status-item">
        <input
          type="radio"
          name="status"
          value="ติดภารกิจ">
        ติดภารกิจ
      </label>


      <label class="title">
        📝 หมายเหตุ
      </label>

      <textarea
        id="note"
        placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)">
      </textarea>
     
      <label class="title">
        📷 รูปภาพประกอบ
      </label>

      <div id="imageInputs"></div>

      <div class="small">
        สามารถเพิ่มได้สูงสุด 6 รูป
      </div>

      <button
        id="saveButton"
        onclick="saveDuty()">

        ✅ บันทึกเวลาปฏิบัติหน้าที่

      </button>


      <div id="message"></div>

    </div>

  </div>

</div>


<script>

const LIFF_ID = '2011190111-3HrsRPRO';

/*
 * สำคัญ
 * ให้นำ Web App URL ของ Apps Script
 * ที่ลงท้าย /exec มาใส่ตรงนี้
 */
const BACKEND_URL =
  'https://script.google.com/macros/s/AKfycbwAMZfeZP9zlB-SvMq370bKq5B9NBjaec1orEoDfKusR_dYaO3N6DFwBDsWV8g_a0Wd/exec';


let idToken = null;


async function init() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });


    if (!liff.isLoggedIn()) {

      liff.login();
      return;

    }


    idToken = liff.getIDToken();


    if (!idToken) {
      throw new Error('ไม่พบ LINE ID Token');
    }


    const profile =
      await liff.getProfile();


    document.getElementById(
      'displayName'
    ).textContent =
      profile.displayName;


    if (profile.pictureUrl) {

      document.getElementById(
        'picture'
      ).src =
        profile.pictureUrl;

    }


    document.getElementById(
      'loading'
    ).style.display =
      'none';


    document.getElementById(
      'main'
    ).style.display =
      'block';


  } catch (error) {

    document.getElementById(
      'loading'
    ).innerHTML =
      '❌ ' + error.message;

  }

}

const MAX_IMAGES = 6;


/*
 * สร้างช่องเลือกรูป
 */
function addImageSlot() {

  const container =
    document.getElementById('imageInputs');

  const current =
    container.querySelectorAll('.image-item');

  if (current.length >= MAX_IMAGES) {
    return;
  }

  const item =
    document.createElement('div');

  item.className =
    'image-item';

  item.innerHTML = `
    <input
      type="file"
      accept="image/*"
      onchange="imageSelected(this)">

    <img
      class="image-preview">

    <button
      type="button"
      class="remove-image"
      onclick="removeImage(this)">
      🗑️ ลบรูปนี้
    </button>
  `;

  container.appendChild(item);
}


/*
 * เมื่อเลือกรูป
 */
async function imageSelected(input) {

  const file = input.files[0];

  if (!file) {
    return;
  }

  const item =
    input.closest('.image-item');

  const preview =
    item.querySelector('.image-preview');

  const removeButton =
    item.querySelector('.remove-image');

  const fileName =
    file.name.toLowerCase();

  const isHeic =
    file.type === 'image/heic' ||
    file.type === 'image/heif' ||
    fileName.endsWith('.heic') ||
    fileName.endsWith('.heif');

  try {

    preview.style.display = 'none';

    if (isHeic) {

      if (typeof heic2any === 'undefined') {
        throw new Error('ไม่พบตัวแปลงไฟล์ HEIC');
      }

      const converted =
        await heic2any({
          blob: file,
          toType: 'image/jpeg',
          quality: 0.75
        });

      const blob =
        Array.isArray(converted)
          ? converted[0]
          : converted;

      preview.src =
        URL.createObjectURL(blob);

    } else {

      preview.src =
        URL.createObjectURL(file);

    }

    preview.style.display = 'block';
    removeButton.style.display = 'block';

  } catch (error) {

    console.error(error);

    preview.style.display = 'none';

    showMessage(
      'ไม่สามารถอ่านรูป ' + file.name,
      false
    );
  }

  const container =
    document.getElementById('imageInputs');

  const items =
    container.querySelectorAll('.image-item');

  if (
    item === items[items.length - 1] &&
    items.length < MAX_IMAGES
  ) {
    addImageSlot();
  }
}


/*
 * ลบรูป
 */
function removeImage(button) {

  const item =
    button.closest('.image-item');

  item.remove();

  ensureEmptyImageSlot();
}


/*
 * ตรวจว่าต้องมีช่องว่างอย่างน้อย 1 ช่อง
 */
function ensureEmptyImageSlot() {

  const container =
    document.getElementById('imageInputs');

  const items =
    container.querySelectorAll('.image-item');

  if (items.length === 0) {
    addImageSlot();
    return;
  }

  const lastInput =
    items[items.length - 1]
      .querySelector('input');

  if (
    lastInput.files.length > 0 &&
    items.length < MAX_IMAGES
  ) {
    addImageSlot();
  }
}
async function compressImage(file) {

  let sourceFile = file;

  const fileName =
    file.name.toLowerCase();

  const isHeic =
    file.type === 'image/heic' ||
    file.type === 'image/heif' ||
    fileName.endsWith('.heic') ||
    fileName.endsWith('.heif');


  // ถ้าเป็น HEIC/HEIF ให้แปลงเป็น JPEG ก่อน
  if (isHeic) {

    try {

      const convertedBlob =
        await heic2any({
          blob: file,
          toType: 'image/jpeg',
          quality: 0.85
        });

      const blob =
        Array.isArray(convertedBlob)
          ? convertedBlob[0]
          : convertedBlob;

      sourceFile =
        new File(
          [blob],
          file.name.replace(
            /\.(heic|heif)$/i,
            '.jpg'
          ),
          {
            type: 'image/jpeg'
          }
        );

    } catch (error) {

      throw new Error(
        'ไม่สามารถแปลงไฟล์ HEIC ได้ กรุณาเลือกรูป JPG หรือ PNG'
      );

    }

  }


  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          const img =
            new Image();


          img.onload =
            function() {

              const MAX_SIZE = 1280;

              let width =
                img.width;

              let height =
                img.height;


              if (
                width > MAX_SIZE ||
                height > MAX_SIZE
              ) {

                if (width > height) {

                  height =
                    Math.round(
                      height *
                      MAX_SIZE /
                      width
                    );

                  width =
                    MAX_SIZE;

                } else {

                  width =
                    Math.round(
                      width *
                      MAX_SIZE /
                      height
                    );

                  height =
                    MAX_SIZE;

                }

              }


              const canvas =
                document.createElement(
                  'canvas'
                );

              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext('2d');


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              const data =
                canvas.toDataURL(
                  'image/jpeg',
                  0.75
                );


              resolve({
                name:
                  sourceFile.name,
                data: data
              });

            };


          img.onerror =
            function() {

              reject(
                new Error(
                  'ไม่สามารถอ่านรูปภาพ ' +
                  sourceFile.name
                )
              );

            };


          img.src =
            event.target.result;

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              'ไม่สามารถอ่านไฟล์รูปภาพได้'
            )
          );

        };


      reader.readAsDataURL(
        sourceFile
      );

    }
  );

}
  
async function saveDuty() {

  const dutyPoint =
    document.getElementById(
      'dutyPoint'
    ).value;


  const status =
    document.querySelector(
      'input[name="status"]:checked'
    );


  const note =
    document.getElementById(
      'note'
    ).value.trim();


  if (!dutyPoint) {

    showMessage(
      'กรุณาเลือกจุดปฏิบัติหน้าที่',
      false
    );

    return;
  }


  if (!status) {

    showMessage(
      'กรุณาเลือกสถานะ',
      false
    );

    return;
  }


  if (!idToken) {

    showMessage(
      'ไม่พบข้อมูลยืนยันตัวตน LINE',
      false
    );

    return;
  }


  if (
    BACKEND_URL.includes(
      'ใส่_URL'
    )
  ) {

    showMessage(
      'ยังไม่ได้ตั้งค่า Apps Script URL',
      false
    );

    return;
  }


  const button =
    document.getElementById(
      'saveButton'
    );


  button.disabled = true;

  button.textContent =
    '⏳ กำลังบันทึก...';


 const imageFiles = [];

document
  .querySelectorAll(
    '#imageInputs input[type="file"]'
  )
  .forEach(function(input) {

    if (input.files.length > 0) {
      imageFiles.push(
        input.files[0]
      );
    }

  });


const images = [];

try {

  for (const file of imageFiles) {

    button.textContent =
      '⏳ กำลังเตรียมรูป ' +
      (images.length + 1) +
      '/' +
      imageFiles.length;

    const image =
      await compressImage(file);

    images.push(image);

  }

} catch (error) {

  button.disabled = false;

  button.textContent =
    '✅ บันทึกเวลาปฏิบัติหน้าที่';

  showMessage(
    '❌ ' + error.message,
    false
  );

  return;
}


const data = {

  idToken: idToken,

  dutyPoint: dutyPoint,

  status: status.value,

  note: note,

  images: images

};

  try {

    /*
     * ใช้ no-cors เพราะ GitHub Pages
     * และ Apps Script เป็นคนละโดเมน
     */
    await fetch(
      BACKEND_URL,
      {
        method: 'POST',

        mode: 'no-cors',

        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify(data)
      }
    );


    showMessage(
      '✅ ส่งข้อมูลเรียบร้อยแล้ว',
      true
    );


    document.getElementById(
      'dutyPoint'
    ).value = '';


    document.querySelectorAll(
      'input[name="status"]'
    ).forEach(
      item => item.checked = false
    );


    document.getElementById(
      'note'
    ).value = '';


  } catch (error) {

    showMessage(
      '❌ ไม่สามารถส่งข้อมูลได้',
      false
    );

  }


  button.disabled = false;

  button.textContent =
    '✅ บันทึกเวลาปฏิบัติหน้าที่';

}



function showMessage(
  message,
  success
) {

  const box =
    document.getElementById(
      'message'
    );


  box.style.display =
    'block';


  box.className =
    success
      ? 'success'
      : 'error';


  box.textContent =
    message;

}



function updateClock() {

  const now =
    new Date();


  document.getElementById(
    'currentDateTime'
  ).textContent =

    now.toLocaleDateString(
      'th-TH',
      {
        dateStyle: 'full'
      }
    )

    + ' เวลา '

    + now.toLocaleTimeString(
      'th-TH'
    );

}


updateClock();

setInterval(
  updateClock,
  1000
);
addImageSlot();

init();

</script>

</body>
</html>
